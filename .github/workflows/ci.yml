name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          # Qt's offscreen platform still needs these system libraries.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install opencv-python-headless numpy pytest PySide6 wyzeapy keyring
      - name: Compile check
        run: python -m py_compile $(find src -name "*.py")
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src pytest tests/ -q
