name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install opencv-python-headless numpy pytest
      - name: Compile check
        run: python -m py_compile $(find src -name "*.py")
      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -q
