name: Release

# Pull requests: build + self-test the Windows installer and attach it as a
# workflow artifact (to try before merging).
# Tags vX.Y.Z: the same, then publish a GitHub release with the installer —
# which is what the in-app updater downloads.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "installer/**"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
          pip install --no-deps .

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        shell: pwsh
        run: |
          $tagArgs = @()
          if ("${{ github.ref_type }}" -eq "tag") { $tagArgs = @("--expect-tag", "${{ github.ref_name }}") }
          python packaging/build_windows.py --require-installer @tagArgs

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process build\dist\WyzePrintMonitor\WyzePrintMonitor.exe `
                 -ArgumentList "--self-test", "$PWD\self-test.txt" -Wait -PassThru
          Get-Content self-test.txt
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: WyzePrintMonitor-installer
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Install

          1. Download **WyzePrintMonitor-${version}-setup.exe** below and run it.
          2. If Windows shows *"Windows protected your PC"*, click **More info → Run anyway** (the installer isn't code-signed).
          3. Open **Wyze Print Monitor** from the Start menu (or search for "Wyze").

          Already installed? The app updates itself: **Update** appears in the app when this release is out.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" build/installer/*.exe \
            --title "Wyze Print Monitor ${version}" \
            --notes-file notes.md --generate-notes --latest
