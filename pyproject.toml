[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyze-print-monitor"
version = "0.1.0"
description = "Desktop live view + camera controls for a Wyze Cam V3 mounted on a 3D printer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "wyzeapy>=0.6.1",
    "keyring>=24.0",
]

[project.scripts]
wyze-print-monitor = "wyze_print_monitor.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
